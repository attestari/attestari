[project]
name = "attestari"
version = "0.0.1"
description = "The auditable memory layer for AI agents — provenance, bi-temporal recall, and provable deletion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Attestari contributors" }]
keywords = ["ai", "agents", "memory", "knowledge-graph", "llm", "rag", "gdpr", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core engine has ZERO required dependencies — the in-memory adapter,
# deterministic extractor, and hash embedder let `examples/spike.py` and the
# eval harness run anywhere with just the standard library. Production adapters
# are opt-in extras below.
dependencies = []

[project.urls]
Homepage = "https://github.com/attestari/attestari"
Repository = "https://github.com/attestari/attestari"
Issues = "https://github.com/attestari/attestari/issues"
Documentation = "https://github.com/attestari/attestari#readme"

[project.scripts]
attestari = "attestari.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]                       # AnthropicExtractor (Claude-powered fact extraction)
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]  # durable Postgres event store + projections
embeddings = ["sentence-transformers>=3.0"]           # real semantic embeddings
crypto = ["cryptography>=42"]                          # crypto-shred deletion
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp>=1.0"]  # REST server + MCP
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]       # httpx for FastAPI TestClient

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestari"]

[tool.ruff]
line-length = 100
src = ["src", "examples", "eval", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
