# Postgres + pgvector for the durable event store + projections.
# `docker compose up` brings up a single Postgres with pgvector and applies
# src/attestari/db/schema.sql on first boot. The zero-dependency spike does NOT need this — it
# runs fully in-memory — but the schema is applied here so the data model is
# exercised end-to-end against the PostgresEventStore.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: attestari
      POSTGRES_PASSWORD: attestari
      POSTGRES_DB: attestari
    ports:
      # Host port is configurable to avoid clashing with a local Postgres.
      # e.g. ATTESTARI_PG_PORT=5433 docker compose up -d
      - "${ATTESTARI_PG_PORT:-5432}:5432"
    volumes:
      - ./src/attestari/db/schema.sql:/docker-entrypoint-initdb.d/000-schema.sql:ro
      - attestari_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attestari -d attestari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  attestari_pgdata:
