name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: notari
          POSTGRES_PASSWORD: notari
          POSTGRES_DB: notari
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notari -d notari"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NOTARI_DATABASE_URL: postgresql://notari:notari@localhost:5432/notari
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The de-risking spike runs with zero dependencies and asserts the full
      # ingest -> recall -> bi-temporal -> forget loop.
      - name: Spike (zero-dependency loop)
        run: python examples/spike.py

      - name: Apply Postgres schema
        run: psql "$NOTARI_DATABASE_URL" -f src/notari/db/schema.sql

      - name: Install (dev + postgres + server)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,server,crypto]"

      - name: Tests (in-memory + postgres + server)
        run: python -m pytest -q

      - name: LangChain integration tests
        run: |
          pip install "langchain-core>=0.3"
          python -m pytest clients/langchain/tests -q

      - name: Eval baseline (built-in dataset)
        run: python -m eval.harness --dataset builtin

      - name: Retrieval latency gate (p95)
        run: python -m eval.bench --engine postgres --subjects 50 --queries 200

      - name: Audit & forget demo (audit -> trace -> forget -> prove)
        run: python examples/audit_and_forget_demo.py
